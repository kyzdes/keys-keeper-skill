name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only checks out the repo and runs tests.
# It needs no write scopes, so drop the default token down to read-only.
# Jobs that ever need more must opt in with their own `permissions:` block.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      COVERAGE_FILE: ${{ runner.temp }}/keys-test-reports/.coverage
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
            live_keyring: false
          - os: windows-latest
            python: "3.12"
            live_keyring: false
          - os: ubuntu-latest
            python: "3.10"
            live_keyring: false
          - os: ubuntu-latest
            python: "3.12"
            live_keyring: true
          - os: ubuntu-latest
            python: "3.14"
            live_keyring: false
    steps:
      # Pin third-party actions to full commit SHAs (not mutable major tags)
      # so a compromised/retagged action can't silently run new code in CI.
      # The trailing comment names the release the SHA corresponds to.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Linux needs the Secret Service stack so the real `secret-tool` backend
      # path is exercised (not just the encrypted-file fallback).
      - name: Install Secret Service stack (Linux)
        if: matrix.live_keyring
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Install
        run: pip install -e ".[dev]" "pytest-cov>=7,<8" "coverage>=7.10.6,<8"

      - name: Prepare test reports
        run: python -c "import os; from pathlib import Path; Path(os.environ['COVERAGE_FILE']).parent.mkdir(parents=True, exist_ok=True)"

      - name: Compile all modules
        run: python -m compileall -q src

      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KEYS_KEEPER_HOME = Join-Path $env:RUNNER_TEMP 'keys-installer-empty-vault'
          ./scripts/install-windows.ps1 -Source $PWD.Path -InstallRoot (Join-Path $env:RUNNER_TEMP 'Keys Keeper Install') -NoLaunch -NoPathUpdate
          Remove-Item Env:KEYS_KEEPER_HOME

      - name: Build native menu bar app (macOS)
        if: runner.os == 'macOS'
        run: python -c "from pathlib import Path; from keys_keeper.macos_app import install_menubar_app; install_menubar_app(Path('dist/native'))"

      # Linux: run under a fresh D-Bus session with an unlocked login keyring so
      # `secret-tool` can store/lookup. We GATE on the keyring actually working
      # (store+lookup round-trip) so the live secret-tool tests can't silently
      # skip and leave a green-but-untested job. Other OSes run pytest directly.
      - name: Test (Linux, with keyring)
        if: matrix.live_keyring
        run: |
          dbus-run-session -- bash -c '
            set -e
            eval "$(echo "" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            # Fail the job if the Secret Service is not actually answering —
            # otherwise the live tests would skip and hide a broken keyring path.
            echo "ci-probe" | secret-tool store --label=ci service ci-probe account p
            test "$(secret-tool lookup service ci-probe account p)" = "ci-probe"
            secret-tool clear service ci-probe account p
            python -m pytest -q --cov --cov-config=.coveragerc --cov-report= --junitxml="${{ runner.temp }}/keys-test-reports/junit.xml" --test-metrics="${{ runner.temp }}/keys-test-reports/test-metrics.json" --durations=40 --durations-min=0.05
          '

      - name: Test
        if: matrix.live_keyring == false
        run: python -m pytest -q --cov --cov-config=.coveragerc --cov-report= --junitxml="${{ runner.temp }}/keys-test-reports/junit.xml" --test-metrics="${{ runner.temp }}/keys-test-reports/test-metrics.json" --durations=40 --durations-min=0.05

      - name: Report coverage and test durations
        if: always()
        run: python scripts/coverage-report.py job --report-dir "${{ runner.temp }}/keys-test-reports" --label "${{ matrix.os }}-py${{ matrix.python }}" --commit "${{ github.sha }}"

      - name: Retain coverage and test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/keys-test-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Check SKILL.md is in sync with canonical prose
        run: keys init claude --check

  coverage:
    name: coverage · full matrix
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install coverage reporter
        run: python -m pip install "coverage>=7.10.6,<8"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-tests-*
          path: ${{ runner.temp }}/matrix-test-reports
      - name: Combine matrix coverage and inventory test quality
        run: |
          python scripts/test-quality-inventory.py --output "${{ runner.temp }}/combined-test-reports/test-quality-inventory.json"
          python scripts/coverage-report.py merge --input-dir "${{ runner.temp }}/matrix-test-reports" --report-dir "${{ runner.temp }}/combined-test-reports" --expected-jobs 5
      - name: Retain combined coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage-full-matrix
          path: ${{ runner.temp }}/combined-test-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  artifact:
    name: wheel · generated payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Check generated UI tokens
        run: python scripts/generate_ui_tokens.py --check

      - name: Verify installed artifact and generated skill
        run: python scripts/verify-release-artifact.py dist/*.whl
