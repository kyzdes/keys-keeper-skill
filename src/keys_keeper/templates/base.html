<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f0d">
<title>{% block title %}keys-keeper · admin{% endblock %}</title>
<script src="/static/theme.js"></script>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app-shell" data-density="comfortable" data-palette="header">
  {% block topbar %}
  <div class="app-topbar">
    <a class="app-brand" href="/" aria-label="Keys Keeper dashboard">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8.25 10.5a4.25 4.25 0 1 1 3.54 4.19L9.5 17H7.75v1.75H6V20.5H3.5v-2.33l5.46-5.46a4.23 4.23 0 0 1-.71-2.21Z"/><circle cx="12.5" cy="10.5" r="1.25"/></svg>
      </span>
      <span>Keys Keeper</span>
    </a>
    <nav class="app-nav" aria-label="Primary">
      <a href="/" class="{% if active_nav == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/audit" class="{% if active_nav == 'audit' %}active{% endif %}">Audit</a>
      <a href="/settings" class="{% if active_nav == 'settings' %}active{% endif %}">Settings</a>
    </nav>
    <div class="app-spacer"></div>
    <button class="app-cmdk-trigger" id="cmdk-trigger" type="button">
      <span>Jump to entry…</span>
      <span class="kbd" style="margin-left:auto">⌘K</span>
    </button>
    <div class="app-actions">
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to day theme" title="Day theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.25"/><path d="M10 2.25v1.5M10 16.25v1.5M2.25 10h1.5M16.25 10h1.5M4.52 4.52l1.06 1.06M14.42 14.42l1.06 1.06M15.48 4.52l-1.06 1.06M5.58 14.42l-1.06 1.06"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.25 12.35A6.65 6.65 0 0 1 7.65 3.75a6.65 6.65 0 1 0 8.6 8.6Z"/></svg>
      </button>
      <a href="/paste" class="btn btn-ghost app-import-action">Bulk import</a>
      <a href="/new" class="btn btn-primary app-new-action">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        <span>New entry</span>
      </a>
    </div>
  </div>
  {% endblock %}
  {% block content %}{% endblock %}
</div>
<div id="cmdk-overlay" hidden role="dialog" aria-modal="true" aria-label="Jump to entry">
  <div class="cmdk-modal">
    <input id="cmdk-input" placeholder="Jump to entry · type to filter" autocomplete="off">
    <div id="cmdk-results"></div>
    <div class="cmdk-footer">
      <span class="kbd">↑↓</span> navigate <span class="kbd">↵</span> open <span class="kbd">Esc</span> close
    </div>
  </div>
</div>
<script src="/static/bootstrap.js"></script>
<script src="/static/app.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
